[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitghost"
version = "1.0.0"
description = "Autonomous Git Diff, AST & Secret Security Scanner with LLM Remediation & Patch Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "EvoderDev" }
]
keywords = [
    "security",
    "git",
    "ast",
    "static-analysis",
    "secret-detection",
    "owasp",
    "llm",
    "patch-generator",
    "code-review",
    "github-action",
    "devsecops"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
gitghost = "gitghost.cli:main"
gh-ghost = "gitghost.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitghost*"]
